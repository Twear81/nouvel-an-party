# Mini-jeu "Qui a dit ça ?" — doc : src/minigames/qui-a-dit/README.md
# Tout le monde répond à la même consigne sur son téléphone, puis on devine qui a écrit chaque réponse.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Titre et phrase d'explication affichés sur la TV
nom: "Qui a dit ça ?"
description: "Écrivez une réponse, puis devinez qui a écrit quoi"

# Temps pour écrire sa réponse, en secondes (l'étape s'arrête 3 s après que tout le monde a envoyé la sienne)
duree_ecriture: 60

# Temps pour deviner l'auteur de CHAQUE citation, en secondes (on passe à la suite dès que tout le monde a voté)
duree_vote: 15

# Temps d'affichage de l'auteur après chaque citation, en secondes
duree_revelation: 5

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 15

# Nombre maximum de caractères d'une réponse (entre 10 et 200)
longueur_max: 80

points:
  bonne_reponse: 100     # points pour chaque joueur qui devine le bon auteur
  auteur_piegeur: 50     # points pour l'auteur, pour chaque joueur qu'il a trompé (mauvaise réponse)

# Une consigne = une ligne commençant par "- " ; une seule est tirée par manche.
# Mettez-les entre guillemets si elles contiennent ": " ou " #".
# Maximum conseillé : 25 consignes.
consignes:
  - "Ta résolution la plus irréaliste pour 2027"
  - "La pire phrase à dire à minuit pile"
  - "Le cadeau de Noël le plus raté que tu aies reçu"
  - "Ce que tu ferais si tu étais président(e) pour une journée"
  - "Ton talent caché le plus inutile"
  - "Le titre de ta biographie"
  - "Ce que tu regrettes d'avoir fait en 2026"
  - "La pire excuse pour quitter une soirée"
  - "Le surnom que tu mériterais dans ce groupe"
  - "Ce que tu emporterais sur une île déserte (à part ton téléphone)"
  - "Ta pire honte de l'année"
  - "Le métier que tu ferais si l'argent n'existait pas"
  - "Une règle absurde que tu imposerais à tous"
  - "Le conseil que tu donnerais à ton toi de 15 ans"
  - "Ce qu'on retrouvera dans ton historique de recherche"
  - "La chose la plus bizarre que tu manges en cachette"
  - "Ton plan machiavélique pour gagner ce soir"
  - "Le dernier message que tu as envoyé par erreur"
  - "Ce que tu dirais si tu étais invité(e) dans une émission de télé-réalité"
  - "La phrase qui résume ton année 2026"
  - "Ton souhait le plus fou pour la nouvelle année"
  - "Ce que tu fais quand personne ne te regarde"
  - "Le pire jeu de mots que tu connaisses"
