# Mini-jeu "Qui est le plus… ?" — doc : src/minigames/qui-est-le-plus/README.md
# Chacun vote sur son téléphone pour l'invité qui correspond le mieux à la question.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Nombre maximum de manches de ce jeu par partie (le lobby ne proposera pas plus ; enlève la ligne pour ne pas plafonner)
manches_max: 20

# Titre et phrase d'explication affichés sur la TV
nom: "Qui est le plus… ?"
description: "Votez pour l'invité qui correspond le mieux à la question"

# Temps pour voter, en secondes (la manche s'arrête plus tôt si tout le monde a voté)
duree: 30

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 15

# true = on peut voter pour soi-même ; false = interdit
vote_pour_soi: false

points:
  majorite: 100   # points pour chaque votant qui a voté pour l'élu (ou un des élus en cas d'égalité)
  elu: 50         # bonus pour la ou les personnes élues

# Une question = une ligne commençant par "- ".
# Forme simple : le texte seul. Forme objet : "texte" + "duree" (secondes) pour surcharger la durée.
# Mettez les questions entre guillemets si elles contiennent ": " ou " #".
# Maximum conseillé : 25 questions (les manches sont tirées au hasard parmi elles).
questions:
  - "Qui est le plus gourmand ?"
  - "Qui sera le premier à s'endormir ce soir ?"
  - "Qui sera le dernier debout ce soir ?"
  - "Qui va pleurer en faisant les voeux de minuit ?"
  - "Qui va oublier sa résolution avant le 3 janvier ?"
  - "Qui va monter sur la table pour danser ?"
  - "Qui est le plus susceptible d'embrasser n'importe qui à minuit ?"
  - "Qui va ouvrir le champagne en arrosant tout le monde ?"
  - "Qui est le plus susceptible d'arriver en retard à son propre mariage ?"
  - "Qui a le pire sens de l'orientation ?"
  - "Qui serait le plus mauvais en cuisine ?"
  - "Qui répond « j'arrive dans 5 minutes » en étant encore chez lui ?"
  - "Qui est le plus drôle quand il a bu ?"
  - "Qui danse le plus mal ?"
  - "Qui chante au karaoké sans qu'on lui demande ?"
  - "Qui ronfle sûrement le plus ?"
  - "Qui passe le plus de temps sur son téléphone ?"
  - "Qui sera le premier à envoyer un message qu'il regrettera demain ?"
  - "Qui aurait le plus de mal à garder un secret ?"
  - "Qui serait le premier à paniquer dans un film d'horreur ?"
  - "Qui est le plus susceptible de manger les restes à 4h du matin ?"
  - "Qui gagnerait au loto et disparaîtrait sans prévenir ?"
  - texte: "Qui serait le premier à survivre sur une île déserte ?"
    duree: 40
  - texte: "Qui mérite le titre de meilleur ami de l'année ?"
    duree: 40
  - texte: "Qui sera la plus grande surprise de 2027 ?"
    duree: 40
