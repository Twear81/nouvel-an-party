  - "Qui a le plus de chances de faire un discours improvisé à minuit ?"
  - "Qui sera le dernier debout ce soir ?"
  - "Qui est le plus susceptible d'embrasser n'importe qui à minuit ?"
  - "Qui va ouvrir le champagne en arrosant tout le monde ?"
  - "Qui prend les résolutions les plus irréalistes ?"
  - "Qui a déjà fait la pire gueule de bois de sa vie ?"
  - "Qui est le plus radin ?"
  - "Qui est le plus susceptible de se perdre avec un GPS ?"
  - "Qui a le pire sens de l'orientation ?"
  - "Qui serait le plus mauvais en cuisine ?"
  - "Qui a le plus grand nombre de photos floues sur son téléphone ?"
  - "Qui répond toujours « j'arrive dans 5 minutes » en étant encore chez lui ?"
