# Mini-jeu "Ceci ou Cela" — doc : src/minigames/ceci-ou-cela/README.md
# Une question, deux réponses (Oui/Non ou deux choix libres : "Mer" / "Montagne").
#  - Question normale : on gagne si on est dans le camp majoritaire.
#  - Question avec {joueur} : un invité tiré au sort répond pour de vrai, les autres devinent sa réponse.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Nombre maximum de manches de ce jeu par partie (le lobby ne proposera pas plus ; enlève la ligne pour ne pas plafonner)
manches_max: 20

# Titre et phrase d'explication affichés sur la TV
nom: "Ceci ou Cela"
description: "Deux réponses possibles : suivez la majorité… ou devinez un invité"

# Temps pour répondre, en secondes (la manche s'arrête plus tôt si tout le monde a répondu)
duree: 20

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 12

# Les deux réponses des questions écrites en texte simple. Exactement 2 choix.
# Gardez-les courts (14 caractères max conseillés) : ce sont de gros boutons sur les téléphones.
choix_par_defaut: [Oui, Non]

points:
  bonne_reponse: 100  # points pour chaque joueur du camp majoritaire / qui devine la réponse de l'invité
  cible: 0            # mode {joueur} : points donnés à l'invité pour chaque personne qui l'a bien deviné (0 = rien)

# Une question = une ligne commençant par "- ". Trois formes possibles :
#   1. Texte seul : utilise les choix_par_defaut (Oui / Non).
#        - "L'ananas sur la pizza ?"
#   2. Objet avec "texte" + "choix" (exactement 2 réponses) + "duree" optionnelle (secondes) :
#        - texte: "Plutôt…"
#          choix: [Mer, Montagne]
#          duree: 25
#   3. Mode {joueur} (dans l'une ou l'autre forme) : {joueur} est remplacé par un invité tiré au sort.
#      Il répond pour de vrai ; les autres devinent. Sans lui (absent), c'est la majorité qui compte.
#        - "Est-ce que {joueur} aime l'ananas sur la pizza ?"
# Mettez les questions entre guillemets si elles contiennent {joueur}, ": " ou " #".
# Maximum conseillé : 25 questions (les manches sont tirées au hasard parmi elles).
questions:
  # --- Dilemmes à deux réponses (majorité) ---
  - texte: "Plutôt…"
    choix: [Chat, Chien]
  - texte: "À 2 h du matin, tu es plutôt :"
    choix: [Au lit, Dernier debout]
    theme: soiree
  - texte: "Le chien monte sur le canapé :"
    choix: [Autorisé, Interdit]
    theme: animaux
  - texte: "Un ami arrive avec une coupe de cheveux ratée :"
    choix: [Je lui dis, Je me tais]
    theme: amitie
  - texte: "Quelqu'un te spoile la fin de ta série :"
    choix: [Pardonnable, Impardonnable]
    theme: amitie
  - texte: "Tu partirais vivre un an au Japon sans parler un mot de japonais ?"
    choix: [Demain, Jamais]
    theme: voyage
  # --- Oui / Non (majorité) ---
  - "L'ananas sur la pizza ?"
  - "Tu tiendras ta résolution jusqu'à février ?"
  - "Tu serais capable de chanter au karaoké ce soir ?"
  # --- Mode {joueur} : on devine sa réponse ---
  - texte: "Est-ce que {joueur} a déjà pleuré devant un anime, un dessin animé ou un k-drama ?"
    theme: emotions
  - "Est-ce que {joueur} chante sous la douche ?"
  - "Est-ce que {joueur} a déjà raté un train ou un avion ?"
  - texte: "Dernière part de tiramisu, personne n'ose. {joueur}…"
    choix: [La prend, La laisse]
    theme: bouffe
