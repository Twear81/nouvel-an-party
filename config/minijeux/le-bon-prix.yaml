# Mini-jeu "Le bon prix" — doc : src/minigames/le-bon-prix/README.md
# Un objet s'affiche sur la TV ; chacun tape son prix (en euros) sur son téléphone. Le plus proche gagne.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Nombre maximum de manches de ce jeu par partie (le lobby ne proposera pas plus ; enlève la ligne pour ne pas plafonner)
manches_max: 5

# Titre et phrase d'explication affichés sur la TV
nom: "Le bon prix"
description: "Devinez le prix de l'objet : le plus proche gagne !"

# Temps pour répondre, en secondes (la manche s'arrête plus tôt si tout le monde a validé).
# Peut être changé pour un objet précis avec "duree:" (voir plus bas).
duree: 30

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 20

points:
  # Points par rang d'écart avec le vrai prix : 1er = le plus proche, 2e, 3e…
  # Les joueurs suivants gagnent 0. Deux joueurs à égalité d'écart partagent le même rang et les mêmes points.
  classement: [150, 100, 60, 30]
  # Bonus ajouté quand on tombe pile sur le prix
  bonus_prix_exact: 100
  # Écart (en CENTIMES) accepté pour compter « prix exact » : 0 = au centime près, 100 = à 1 € près
  tolerance_centimes: 0

# Les objets à deviner : un objet = un bloc commençant par "- nom:". Maximum conseillé : 25.
#   nom      (obligatoire) ce qui s'affiche en grand sur la TV
#   prix     (obligatoire) le vrai prix en EUROS, centimes avec un POINT : 3.49  (pas de virgule, pas de signe €)
#   emoji    affiché sur le piédestal quand il n'y a pas de photo
#   image    une photo (voir ci-dessous) ; elle remplace l'emoji
#   details  un indice affiché sous le nom (contenance, taille, année…)
#   duree    temps de réponse propre à cet objet, en secondes
#
# Ajouter une VRAIE PHOTO : copiez le fichier (jpg, png, webp) dans le dossier config/medias/
# puis indiquez simplement son nom :
#     - nom: "Ma montre de grand-père"
#       prix: 350
#       image: montre.jpg
# Si le fichier est introuvable, l'emoji (ou 🎁) s'affiche à la place. Évitez les photos de plus de 1 Mo.
#
# Prix indicatifs France 2026 : changez-les à votre goût !
