# Mini-jeu "Dessin raté" — doc : src/minigames/dessin-rate/README.md
# Chacun dessine son mot secret sur son téléphone en un temps très court, les dessins défilent sur la TV, puis on vote.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Titre et phrase d'explication affichés sur la TV
nom: "Dessin raté"
description: "Dessine ton mot secret en 20 secondes, votez pour le meilleur"

# Temps pour dessiner, en secondes (le dessin est figé à la fin)
duree_dessin: 20

# Temps d'affichage de CHAQUE dessin en grand sur la TV (avec son mot et son auteur), en secondes
duree_galerie: 4

# Temps pour voter, en secondes (le vote s'arrête dès que tout le monde a voté)
duree_vote: 20

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 20

points:
  par_vote: 50     # points pour chaque vote reçu
  gagnant: 100     # points en plus pour le(s) dessin(s) le plus voté (ex æquo : tous ; aucun vote : personne)

# Les mots. Chaque manche tire UNE difficulté, et chaque joueur reçoit un mot différent de cette difficulté :
# personne n'est avantagé. Une liste doit avoir au moins 8 mots pour être jouée ; avec 16 mots ou plus, la
# difficulté revient sur plusieurs manches (une manche par tranche de 8 mots), sans répéter de mot.
# Comment classer un mot : voir le README (en gros : on peut le dessiner sans écrire de texte ?).
# Mettez-les entre guillemets s'ils contiennent ": " ou " #".
mots:
  # Facile : un objet concret, reconnaissable en 3 traits
  facile:
    - "Une banane"
    - "Un sapin de Noël"
    - "Une bouteille de champagne"
    - "Une montre"
    - "Un chapeau de fête"
