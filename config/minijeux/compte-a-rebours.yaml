# Mini-jeu "Compte à rebours chaotique" — doc : src/minigames/compte-a-rebours/README.md
# TOUT LE MONDE joue en même temps : la TV annonce une cible (ex. « Arrêtez-vous à 8,0 s ! »), puis « 3… 2… 1… GO ».
# Chacun appuie sur STOP sur son téléphone quand il pense que la cible est atteinte. Le compteur de la TV est lisible
# quelques secondes puis devient fou : il faut finir de compter dans sa tête. Le plus proche de la cible gagne.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Nombre maximum de manches de ce jeu par partie (le lobby ne proposera pas plus ; enlève la ligne pour ne pas plafonner)
manches_max: 3

# Titre et phrase d'explication affichés sur la TV
nom: "Compte à rebours chaotique"
description: "Appuie sur STOP quand le compteur fou atteint la cible : le plus proche gagne !"

# Secondes d'annonce de la cible (très grand sur la TV) avant le « 3… 2… 1… GO »
annonce: 6

# La cible est tirée au hasard à chaque manche, au demi-seconde (6, 6,5, 7… 12), entre ces deux bornes (en secondes)
cible_min: 6
cible_max: 12

# Secondes pendant lesquelles le compteur est lisible avant de devenir chaotique (tirées au hasard entre les deux, au dixième).
# 0 = chaotique d'emblée.
visible_min: 2
visible_max: 3

# Le compteur continue jusqu'à ce que tout le monde ait appuyé, ou au plus tard jusqu'à cible + marge_max secondes.
# Ceux qui n'ont pas appuyé à ce moment-là sont ratés (0 point).
marge_max: 4

# Temps (en secondes) estimé pour la révélation et les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 25

# Points par place : le 1er touche le 1er nombre, le 2e le 2e, etc. Place absente de la liste = 0 point.
# Égalité (même écart au centième de seconde) : les ex æquo touchent tous les points de la meilleure place.
points: [150, 100, 70, 50, 30, 20, 10, 0]

# Les looks de compteur possibles, un par manche (tirés au hasard, sans répétition dans une partie).
# Chacun devient chaotique à sa façon. Retirez une ligne pour désactiver un design :
#   digital  - chronomètre digital : les chiffres sautent, tournent, s'effacent, repartent à l'envers
#   horloge  - horloge à trotteuse : l'aiguille s'affole, se dédouble, puis disparaît
#   meche    - bombe à mèche : l'étincelle avance par saccades, une fumée masque la mèche
#   coupe    - coupe de champagne qui se remplit : le niveau saute, déborde, se vide
#   minuit   - décompte du Nouvel An : le chiffre compte n'importe comment, l'anneau tourne
designs:
  - digital
  - horloge
  - meche
  - coupe
  - minuit
