# Mini-jeu "Culture gênante" — doc : src/minigames/culture-genante/README.md
# JEU SURPRISE (interlude) : il ne se règle pas avec un nombre de manches, il surgit tout seul,
# environ une fois toutes les `tous_les` manches, sans annonce. La TV casse l'ambiance :
#   1. une accroche rigolote qui s'écrit,   2. la bascule « Bon. Plus sérieusement. » (écran sombre),
#   3. une question qui met mal à l'aise,   4. la révélation (« 2 / 7 ont trouvé… »).
# Sur l'écran de lancement de la TV, un interrupteur Activé / Désactivé remplace le nombre de manches.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Titre et phrase d'explication
nom: "Culture gênante"
description: "La TV casse l'ambiance : une question qui met mal à l'aise"

# Rythme : une manche surprise environ toutes les N manches normales (1 par bloc de N, à un moment aléatoire du bloc,
# jamais en première position ni deux de suite). Avec 20 manches et tous_les: 5 → environ 4 surprises.
tous_les: 5

# Durée de chaque étape, en secondes
duree_accroche: 4     # la phrase rigolote (elle s'écrit pendant ~2,5 s, le reste sert à la lire)
duree_bascule: 2      # la rupture : écran sombre, phrase sérieuse
duree_question: 15    # temps pour répondre (la manche s'arrête plus tôt si tout le monde a répondu)
temps_resultats: 8    # temps estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée

points:
  bonne_reponse: 100          # QCM : bonne réponse
  bonus_rapidite: 50          # QCM : bonus maximal pour une bonne réponse instantanée (décroît jusqu'à 0 à la fin du temps)
  estimation_premier: 150     # estimation : points du plus proche
  estimation_decroissance: 50 # estimation : points perdus à chaque rang suivant (150, 100, 50, puis 0). Ex æquo = même rang

# Les accroches : une partie rigolote + la phrase de bascule sérieuse. Une est tirée au hasard à chaque manche
# (sauf si la question en impose une, voir plus bas). Gardez-les courtes : 80 caractères maximum conseillés.
# Option : `image:` et `son:` = fichiers du dossier config/medias (ex. image: "fete.jpg", son: "rires.mp3"), affichés / joués
# pendant la partie rigolote. Facultatifs.
accroches:
  - rigolo: "Haha, quelle ambiance, on rigole bien…"
    serieux: "Bon. Plus sérieusement."
  - rigolo: "Ça sent la fête, les amis, c'est magnifique !"
    serieux: "Stop. On redescend."
  - rigolo: "Champagne, rires, confettis… la vie est belle !"
    serieux: "Passons aux choses sérieuses."
  - rigolo: "Quelle belle soirée, tout le monde est détendu…"
    serieux: "C'était trop beau. Silence."
  - rigolo: "Les voisins tapent au mur, c'est qu'on s'amuse !"
    serieux: "Maintenant, on se concentre."
  - rigolo: "Qui veut encore du gâteau ? Haha, quelle bonne humeur !"
    serieux: "Posez vos verres."
  - rigolo: "Ah là là, qu'est-ce qu'on rigole !"
    serieux: "On se calme. Regardez-moi."
  - rigolo: "Santé ! À nous ! Aux amis !"
    serieux: "Très bien. Voyons qui a de la culture."
  - rigolo: "On est bien là, hein ? Tranquilles, sans pression…"
    serieux: "Fin de la récréation."
  - rigolo: "Personne ne juge personne ce soir, c'est la fête !"
    serieux: "Menteurs. Question."
  - rigolo: "Les confettis, la musique, les bonnes résolutions de 2027 !"
    serieux: "Pour bien commencer l'année : un petit contrôle de niveau."
  - rigolo: "Vous avez de la conversation, ce soir, c'est formidable !"
    serieux: "Vérifions."
  - rigolo: "Haha, vous êtes trop drôles, vraiment…"
    serieux: "Ça suffit."

# Les questions : deux types.
#
#   QCM (2 à 4 réponses, la BONNE EN PREMIER : l'ordre est mélangé à l'écran, personne ne le voit) :
#     - texte: "Quelle est la capitale de l'Australie ?"
#       reponses: ["Canberra", "Sydney"]
#
#   Estimation (un nombre entier ; le plus proche gagne ; `unite` est facultative) :
#     - texte: "En quelle année l'homme a-t-il marché sur la Lune ?"
#       estimation: 1969
#
#   Options communes (toutes facultatives) :
#       commentaire: "Phrase affichée avec la bonne réponse."
#       duree: 20                       # durée de cette question (sinon duree_question)
#       accroche: { rigolo: "...", serieux: "..." }   # impose l'accroche (sinon tirée au hasard dans la liste ci-dessus)
#
# Réponses courtes (40 caractères max) : ce sont de gros boutons sur les téléphones.
# Mettez les textes entre guillemets (surtout s'ils contiennent ":" ou "?").
# Une question tirée n'est jamais rejouée dans la partie.
questions:
  # --- Culture générale « basique mais ça pique » ---
  - texte: "Quelle est la capitale de l'Australie ?"
    reponses: ["Canberra", "Sydney"]
    commentaire: "Sydney est la plus grande ville, mais la capitale, c'est Canberra."
  - texte: "Quel est le plus grand pays d'Afrique par sa superficie ?"
    reponses: ["L'Algérie", "RD Congo", "Le Nigeria", "L'Égypte"]
  - texte: "Quel pays est le plus peuplé du monde aujourd'hui ?"
    reponses: ["L'Inde", "La Chine", "Les États-Unis"]
    commentaire: "L'Inde a dépassé la Chine en 2023."
  - texte: "Quel animal dort le plus ?"
    reponses: ["Le koala", "Le paresseux", "Le chat", "Toi, le 1er janvier"]
    commentaire: "Environ 20 heures par jour pour le koala. Toi, ça va dépendre de ce soir."
  - texte: "Quel animal fait des crottes en forme de cube ?"
    reponses: ["Le wombat", "Le koala", "Le capybara", "Le paresseux"]
    commentaire: "Le wombat : ça évite que ses crottes roulent, il les utilise pour marquer son territoire."
    theme: animaux
  - texte: "Quel oiseau reconnaît un visage humain et transmet sa rancune à ses petits ?"
    reponses: ["Le corbeau", "Le pigeon", "Le perroquet", "Ta belle-mère"]
    commentaire: "Les corvidés reconnaissent les visages, et leurs petits héritent des rancunes. Soyez gentils avec eux."
    theme: animaux
  - texte: "Lequel de ces aliments est toxique pour un chien ?"
    reponses: ["Le raisin", "La carotte", "Le concombre", "La pomme sans pépins"]
    commentaire: "Le raisin : même quelques grains peuvent lui abîmer les reins. Le chocolat, vous le saviez déjà."
    theme: animaux

  # --- Estimations ---
  - texte: "Combien de planètes compte le système solaire ?"
    estimation: 8
    commentaire: "Pluton n'est plus une planète depuis 2006."
  - texte: "Combien de fois par jour un adulte pète-t-il en moyenne ?"
    estimation: 14
    unite: "fois"
    commentaire: "Entre 10 et 20. Vous en avez forcément retenu un ce soir."
    theme: corps
  - texte: "Quel pourcentage du corps adulte est de l'eau ?"
    estimation: 60
    unite: "%"
    commentaire: "Environ 60 %. Ce soir, plutôt 40 % d'eau et 20 % de champagne."
    theme: corps
  - texte: "En quelle année a démarré le manga Dragon Ball ?"
    estimation: 1984
    commentaire: "Goku a plus de 40 ans de carrière et n'a toujours pas de fiche de paie."
    theme: manga

  # --- Réponses problématiques, humour noir (jamais sur une personne ou un groupe : sur la situation, et sur vous) ---
  - texte: "Quel animal tue le plus d'humains chaque année ?"
    reponses: ["Le moustique", "Le requin", "L'hippopotame", "Tonton au volant après minuit"]
    commentaire: "Le moustique, très loin devant. Tonton est en embuscade."
  - texte: "Quelle est la première cause de mortalité dans le monde ?"
    reponses: ["Les maladies du cœur", "Les requins", "Les accidents de trottinette", "Le gluten"]
  - texte: "Combien de temps vit en moyenne un hamster ?"
    reponses: ["2 à 3 ans", "8 ans", "15 ans"]
    commentaire: "Prends-en soin, c'est court."
  - texte: "Quelle est l'espérance de vie à la naissance en France, en années ?"
    estimation: 83
    unite: "ans"
    commentaire: "Environ 80 ans pour les hommes, 86 pour les femmes. Messieurs, finissez votre verre."
    theme: sante
  - texte: "Combien d'humains vivent sur Terre, en milliards ?"
    estimation: 8
    unite: "milliards"
    commentaire: "Et vous voilà coincés avec les mêmes dans cette pièce."
  - texte: "Qui a inventé le feu d'artifice ?"
    reponses: ["La Chine", "L'Italie", "Alfred Nobel", "Ton beau-frère et son rosé"]
    commentaire: "Les Chinois, avec la poudre. Ton beau-frère a seulement perfectionné les dégâts."
