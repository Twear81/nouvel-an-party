# Mini-jeu "Tier list" — doc : src/minigames/tier-list/README.md
# Une question s'affiche (« Qui est le meilleur cuisinier ? »). Chacun range TOUS les invités dans des étages
# (S, A, B, C…) sur son téléphone. L'étage d'un invité = la moyenne des notes reçues, arrondie.
# On marque des points pour chaque invité placé dans le même étage que le consensus.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Nombre maximum de manches de ce jeu par partie (le lobby ne proposera pas plus ; enlève la ligne pour ne pas plafonner)
manches_max: 5

# Titre et phrase d'explication affichés sur la TV
nom: "Tier list"
description: "Rangez chaque invité de S à C : gagnez en pensant comme les autres"

# Temps pour noter, en secondes (la manche s'arrête plus tôt quand tout le monde a noté tout le monde).
# Comptez environ 6 secondes par invité à noter. Les notes déjà données comptent même si le chrono se termine.
duree: 60

# Temps (en secondes) estimé pour lire les résultats (la TV révèle les invités un par un, ~10 s) ;
# sert uniquement au calcul de durée de la soirée
temps_resultats: 30

# true = chacun se note aussi lui-même ; false = on ne note que les autres
noter_soi_meme: true

# Les étages, du plus haut au plus bas. Entre 2 et 6 étages, 6 caractères maximum chacun, tous différents.
# Exemples : [S, A, B, C]   [Top, Moyen, Nul]   [A, B, C, D, E]
tiers: [S, A, B, C]

points:
  consensus: 25   # points par invité que vous avez placé dans son étage final (celui de la moyenne)

# Une question = une ligne commençant par "- ".
# Forme simple : le texte seul. Forme objet : "texte" + "duree" (secondes) pour surcharger la durée.
# Mettez les questions entre guillemets si elles contiennent ": " ou " #".
# Gardez-les courtes (une ligne sur la TV, deux sur un téléphone).
# Maximum conseillé : 25 questions (les manches sont tirées au hasard parmi elles).
questions:
  - texte: "Qui est le meilleur cuisinier ?"
    theme: bouffe
  - texte: "Qui est le meilleur danseur ?"
    theme: musique
  - texte: "Qui est le meilleur conducteur ?"
    theme: voyage
  - texte: "Qui est le meilleur au karaoké ?"
    theme: musique
  - texte: "Qui est le meilleur public pour une blague nulle ?"
    theme: amitie
  - texte: "Qui est le meilleur pour garder un secret ?"
    theme: amitie
  - texte: "Qui est le meilleur perdant ?"
    theme: jeu
  - texte: "Qui est le meilleur pour tenir l'alcool ?"
    theme: soiree
  - texte: "Qui est le meilleur menteur ?"
    theme: excuses
  - texte: "Qui est le meilleur pour s'habiller ?"
    theme: vie
  - texte: "Qui est le meilleur à Mario Kart ?"
    theme: jeu-video
  - texte: "Qui est le meilleur coloc ?"
    theme: vie
  - texte: "Qui est le meilleur pour faire la fête jusqu'au bout ?"
    theme: soiree
  - texte: "Qui serait là à 3 h du matin si ça va mal ?"
    duree: 75
