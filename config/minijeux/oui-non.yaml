# Mini-jeu "Oui ou Non" — doc : src/minigames/oui-non/README.md
# Deux modes selon la question :
#  - avec {joueur} : un invité tiré au sort répond honnêtement, les autres devinent sa réponse ;
#  - sans {joueur} : question d'opinion, on gagne si on est dans le camp majoritaire.
# Modifier ce fichier demande de relancer NouvelAn.exe.

# false = le jeu n'apparaît pas dans la partie (le fichier est conservé)
actif: true

# Titre et phrase d'explication affichés sur la TV
nom: "Oui ou Non"
description: "Devinez ce que pense la majorité… ou un invité tiré au sort"

# Temps pour répondre, en secondes (la manche s'arrête plus tôt si tout le monde a répondu)
duree: 20

# Temps (en secondes) estimé pour lire les résultats ; sert uniquement au calcul de durée de la soirée
temps_resultats: 12

points:
  bonne_reponse: 100   # points pour une bonne réponse (bon camp, ou bonne devinette)
  cible: 0             # mode {joueur} : points donnés à l'invité ciblé pour chaque personne qui l'a bien deviné

# Une question = une ligne commençant par "- ".
# {joueur} est remplacé par le pseudo d'un invité tiré au sort. Quand la question commence
# par {joueur} ou contient ": ", mettez-la entre guillemets (ici toutes celles avec {joueur} le sont).
# Forme objet possible : "texte" + "duree" (secondes).
questions:
  # --- Questions générales (la majorité l'emporte)
  - L'ananas sur la pizza, c'est acceptable ?
  - "Le 1er janvier, on fait la grasse matinée jusqu'à midi ?"
  - "Les résolutions du Nouvel An, ça marche vraiment ?"
  - "Le champagne est meilleur que le crémant ?"
  - "Il faut s'embrasser à minuit, même sans en avoir envie ?"
  - "Le 31 décembre est la meilleure fête de l'année ?"
  - "On peut mettre de la musique de Noël après le 26 décembre ?"
  - "Il est acceptable de répondre à un message du boulot pendant la soirée ?"
  - "Les chaussettes avec des sandales, c'est ok en été ?"
  - "La galette des rois est meilleure à la frangipane qu'à la crème ?"
  - "Les huîtres, c'est délicieux ?"
  - "Le foie gras, c'est indispensable pour les fêtes ?"
  - "On devrait supprimer la tradition des cartes de voeux ?"
  - "Le réveillon est mieux chez soi qu'au restaurant ?"
  - "Une soirée réussie, c'est une soirée qui finit après 5h du matin ?"
  - "Les feux d'artifice, ça vaut le coup d'attendre dans le froid ?"
  - "La gueule de bois, ça se soigne avec un gros petit déjeuner gras ?"
  - "Il est normal d'avoir plus de 100 photos de nourriture dans son téléphone ?"
  - "On peut danser sans musique si l'ambiance est bonne ?"
  - "Il vaut mieux avoir trop de nourriture que pas assez ?"
  - "Le karaoké est une bonne idée à une heure du matin ?"
  - "Un bon ami ne prête jamais de l'argent ?"
  - "Le chocolat noir est supérieur au chocolat au lait ?"
  - "On peut se passer de télévision pendant un mois ?"
  - "La pluie est plus agréable que la neige ?"
  # --- Questions sur un invité (la cible répond honnêtement, les autres devinent)
  - "Est-ce que {joueur} a déjà pleuré devant un Disney ?"
  - "Est-ce que {joueur} sera encore debout à 4h du matin ?"
  - "Est-ce que {joueur} a déjà chanté sous la douche aujourd'hui ?"
  - "Est-ce que {joueur} a déjà pris une résolution qu'il a tenue toute l'année ?"
  - "Est-ce que {joueur} a déjà raté un train ou un avion ?"
  - "Est-ce que {joueur} a déjà oublié un anniversaire important ?"
  - "Est-ce que {joueur} aime l'ananas sur la pizza ?"
  - "Est-ce que {joueur} s'est déjà endormi pendant une soirée ?"
  - "Est-ce que {joueur} a déjà menti pour sortir d'une obligation ?"
  - "Est-ce que {joueur} garde ses sms non lus pendant plusieurs jours ?"
  - "Est-ce que {joueur} a déjà dansé sur une table ?"
  - "Est-ce que {joueur} a déjà fait une grosse bêtise en voiture ?"
  - "Est-ce que {joueur} préfère le sucré au salé ?"
  - "Est-ce que {joueur} a déjà pleuré à un mariage ?"
  - "Est-ce que {joueur} connaît les paroles de la Marseillaise en entier ?"
  - "Est-ce que {joueur} a déjà envoyé un message à la mauvaise personne ?"
  - "Est-ce que {joueur} a déjà dormi en dehors de chez lui sans prévenir ?"
  - "Est-ce que {joueur} a un truc honteux dans sa playlist ?"
  - "Est-ce que {joueur} croit aux horoscopes ?"
  - "Est-ce que {joueur} a déjà fait semblant de rire à une blague ?"
  - "Est-ce que {joueur} regarde son téléphone en premier le matin ?"
  - "Est-ce que {joueur} est déjà tombé amoureux en soirée ?"
  - "Est-ce que {joueur} est capable de cuisiner un plat sans recette ?"
  - texte: "Est-ce que {joueur} tiendra ses bonnes résolutions jusqu'en février ?"
    duree: 25
  - texte: "Est-ce que {joueur} a déjà regretté un message envoyé à minuit ?"
    duree: 25
