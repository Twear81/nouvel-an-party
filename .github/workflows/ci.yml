# CI : vérifie chaque push (toutes branches) et chaque pull request.
# Enchaîne : installation (lockfile figé), typecheck, tests unitaires, build web, tests E2E (Playwright sur Chromium, Firefox et WebKit :
# les téléphones de la soirée sont des Chrome/Firefox Android et des Safari iPhone).
# En cas d'échec, le rapport Playwright et les résultats de test sont remontés en artefacts (onglet "Artifacts" du run).
# Déclenchement : automatique à chaque push ou pull request, rien à faire.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Installer les dépendances (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests unitaires
        run: bun run test

      - name: Build web
        run: bun run build:web

      - name: Installer Chromium, Firefox et WebKit pour Playwright
        run: bunx playwright install --with-deps chromium firefox webkit

      # Firefox ne fait tourner WebAudio qu'avec une sortie son : sans elle, son AudioContext reste « suspended »
      # et la musique de la TV ne démarre jamais (audio-compat.spec.ts). Une sortie muette suffit.
      - name: Sortie son factice (PulseAudio, sortie muette)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=muette
          pactl set-default-sink muette

      - name: "Tests E2E (les 3 projets : chromium, firefox, webkit)"
        run: bun run test:e2e

      - name: Remonter le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
