# CI : vérifie chaque push (toutes branches) et chaque pull request.
# Enchaîne : installation (lockfile figé), typecheck, tests unitaires, build web, tests E2E (Playwright/Chromium).
# En cas d'échec, le rapport Playwright et les résultats de test sont remontés en artefacts (onglet "Artifacts" du run).
# Déclenchement : automatique à chaque push ou pull request, rien à faire.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Installer les dépendances (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests unitaires
        run: bun run test

      - name: Build web
        run: bun run build:web

      - name: Installer Chromium pour Playwright
        run: bunx playwright install --with-deps chromium

      - name: Tests E2E
        run: bun run test:e2e

      - name: Remonter le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
