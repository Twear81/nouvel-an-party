# CI : vérifie chaque push (toutes branches) et chaque pull request.
# Enchaîne : installation (lockfile figé), typecheck, tests unitaires, build web. Rapide (~1 min) et sans hasard.
# Les tests E2E (Playwright) ne tournent PAS ici : trop longs et instables sur les machines GitHub (pas de son, mémoire
# de WebKit). Ils se lancent en local avant chaque push : voir « Tests » dans CLAUDE.md et README.md.
# Déclenchement : automatique à chaque push ou pull request, rien à faire.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Typecheck, tests unitaires et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Installer les dépendances (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests unitaires
        run: bun run test

      - name: Build web
        run: bun run build:web

